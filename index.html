<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      name="theme-color"
      content="#F28C28"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta name="format-detection" content="telephone=no" />
    <!-- GPU acceleration hints cho Zalo WebView / WKWebView -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="renderer" content="webkit" />
    <!-- Tắt touch callout và user-select toàn app -->
    <style>
      * { -webkit-tap-highlight-color: transparent; }
      canvas { -webkit-transform: translateZ(0); transform: translateZ(0); image-rendering: auto; }
      body { overscroll-behavior: none; overflow: hidden; }
    </style>

    <meta
      name="description"
      content="Cing Hu Tang Mini App"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <title>
      Cing Hu Tang Mini App
    </title>
  </head>

  <body class="bg-brand-light">
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
