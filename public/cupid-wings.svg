    <path d="M-6,-2 C-15,-6 -40,-10 -55,-32 C-60,-42 -50,-56 -36,-50 C-24,-44 -14,-30 -8,-16 C-4,-8 -3,-2 -6,-2 Z"
      fill="white" fill-opacity="0.7" stroke="#ccddf0" stroke-width="0.5"/>
    <!-- Anh sang -->
    <path d="M-10,-5 C-22,-20 -38,-50 -32,-72" fill="none" stroke="white" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round"/>
  </g>

  <!-- CANH PHAI (mirror) -->
  <g transform="translate(100,80) scale(-1,1)">
    <path d="M-8,0 C-20,-8 -55,-15 -75,-45 C-85,-65 -70,-90 -50,-82 C-35,-76 -20,-55 -12,-35 C-6,-20 -5,-8 -8,0 Z"
